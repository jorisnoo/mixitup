name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dist is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --short dist
            echo "::error::dist/ in this tag does not match a fresh build. Run 'npm run build', commit, and re-tag."
            exit 1
          fi

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION="${{ github.ref_name }}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog:** https://github.com/${{ github.repository }}/blob/v3/CHANGELOG.md" >> release_notes.md

      - name: Create release
        run: gh release create "${{ github.ref_name }}" --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
