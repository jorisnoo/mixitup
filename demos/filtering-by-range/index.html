<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="../reset.css" rel="stylesheet"/>
        <link href="./style.css" rel="stylesheet"/>

        <title>MixItUp Demo - Filtering by Range</title>

        <!-- Color and size are combined in application code; sorting uses built-in controls. -->
    </head>
    <body>
        <div class="controls">
            <button type="button" class="control" data-color="all" aria-pressed="true">All</button>
            <button type="button" class="control" data-color="green" aria-pressed="false">Green</button>
            <button type="button" class="control" data-color="blue" aria-pressed="false">Blue</button>
            <button type="button" class="control" data-color="pink" aria-pressed="false">Pink</button>
            <button type="button" class="control" data-color="none" aria-pressed="false">None</button>

            <button type="button" class="control" data-sort="size:asc">Asc</button>
            <button type="button" class="control" data-sort="size:desc">Desc</button>

            <datalist id="sizeLegend">
                <option value="0">
                <option value="1">
                <option value="2">
                <option value="3">
                <option value="4">
                <option value="5">
                <option value="6">
                <option value="7">
                <option value="8">
                <option value="9">
                <option value="10">
            </datalist>

            <div class="range-slider">
                <label class="range-slider-label" for="minSize">Min</label>

                <input id="minSize" name="minSize" class="range-slider-input" type="range" min="0" max="10" value="0" list="sizeLegend"/>
            </div>

            <div class="range-slider">
                <label class="range-slider-label" for="maxSize">Max</label>

                <input id="maxSize" name="maxSize" class="range-slider-input" type="range" min="0" max="10" value="10" list="sizeLegend"/>
            </div>
        </div>

        <div class="container" data-ref="container">
            <div class="mix green" data-size="1"></div>
            <div class="mix green" data-size="3"></div>
            <div class="mix blue" data-size="4"></div>
            <div class="mix pink" data-size="5"></div>
            <div class="mix green" data-size="0"></div>
            <div class="mix green" data-size="3"></div>
            <div class="mix blue" data-size="8"></div>
            <div class="mix pink" data-size="2"></div>
            <div class="mix blue" data-size="10"></div>
            <div class="mix blue" data-size="7"></div>

            <div class="gap"></div>
            <div class="gap"></div>
            <div class="gap"></div>
        </div>

        <script type="module">
            import mixitup from '../../dist/mixitup.js';

            const mixer = mixitup('[data-ref="container"]');
            const minSize = document.querySelector('#minSize');
            const maxSize = document.querySelector('#maxSize');
            const buttons = document.querySelectorAll('[data-color]');
            let color = 'all';

            function applyFilter() {
                const min = minSize.valueAsNumber;
                const max = maxSize.valueAsNumber;
                const matches = mixer.getState().targets.filter(target => {
                    const size = Number(target.dataset.size);
                    return (color === 'all' || target.classList.contains(color)) &&
                        size >= min && size <= max;
                });

                mixer.filter(matches);
            }

            for (const button of buttons) {
                button.addEventListener('click', () => {
                    color = button.dataset.color;
                    for (const option of buttons) {
                        option.setAttribute('aria-pressed', String(option === button));
                    }
                    applyFilter();
                });
            }

            minSize.addEventListener('change', applyFilter);
            maxSize.addEventListener('change', applyFilter);
        </script>
    </body>
</html>
